# Fly.io config. Change `app` to something unique (e.g. rezzie-yourinitials)
# or let `fly launch` rename it. See README → Deploy.
app = "rezzie-CHANGE-ME"
primary_region = "ewr"   # Newark: close to NYC restaurants and Resy's servers

[build]

[env]
  DATA_DIR = "/data"
  APP_TIMEZONE = "America/New_York"

[mounts]
  source = "rezzie_data"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  # Must stay running 24/7 so snipes fire on time.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "10s"
    method = "GET"
    path = "/healthz"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
