# fly.toml app configuration file generated for rezzie on 2026-11-03T22:05:26Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'rezzie'
primary_region = 'ams'

[build]

[env]
  APP_TIMEZONE = 'America/New_York'
  DATA_DIR = '/data'

[[mounts]]
  source = 'rezzie_data'
  destination = '/data'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    interval = '30s'
    timeout = '5s'
    grace_period = '10s'
    method = 'GET'
    path = '/healthz'

[[vm]]
  size = 'shared-cpu-1x'
  memory = '512mb'
